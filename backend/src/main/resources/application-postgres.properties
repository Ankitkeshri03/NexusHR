# PostgreSQL profile
spring.datasource.url=jdbc:postgresql://localhost:5432/nexushr_db
spring.datasource.username=postgres
spring.datasource.password=Mohd@4568
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
# Mail (Brevo SMTP by default; override with env vars in deployment)
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from-name=${APP_MAIL_FROM_NAME:NexusHR}
app.mail.from-email=${APP_MAIL_FROM_EMAIL:${MAIL_USERNAME:}}
app.mail.support-email=${APP_MAIL_SUPPORT_EMAIL:${APP_MAIL_FROM_EMAIL:${MAIL_USERNAME:}}}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:${MAIL_HOST:smtp-relay.brevo.com}}
