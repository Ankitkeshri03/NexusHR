# Production database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Frontend links used in account emails
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Mail (Brevo SMTP by default; override with env vars in deployment)
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from-name=${APP_MAIL_FROM_NAME:NexusHR}
app.mail.from-email=${APP_MAIL_FROM_EMAIL:${MAIL_USERNAME:}}
app.mail.support-email=${APP_MAIL_SUPPORT_EMAIL:${APP_MAIL_FROM_EMAIL:${MAIL_USERNAME:}}}
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Auth security
security.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
security.auth.lockout-duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}
security.token.email-verification-hours=${EMAIL_VERIFICATION_TOKEN_HOURS:24}
security.token.password-reset-hours=${PASSWORD_RESET_TOKEN_HOURS:2}
