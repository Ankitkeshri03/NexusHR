spring.datasource.url=jdbc:h2:mem:nexushr_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.mail.enabled=false
app.frontend-base-url=http://localhost:5173
app.mail.support-email=support@nexushr.test
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test-password

security.jwt.secret=test-only-jwt-secret-with-sufficient-length-1234567890
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000
security.auth.max-failed-attempts=5
security.auth.lockout-duration-minutes=15
security.token.email-verification-hours=24
security.token.password-reset-hours=2
